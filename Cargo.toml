[package]
name = "cortex-snn"
version = "0.1.0"
description = "Spiking-neural-network substrate for the Cortex project — pure-Rust, no I/O, embed-anywhere"
edition.workspace = true
publish.workspace = true

[lib]
name = "cortex_snn"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# Seedable, deterministic RNG for `cortex_snn::seeds`. `small_rng` is
# enabled because we use `SmallRng` — fast, deterministic given a seed,
# 0 dep overhead beyond `rand` itself.
rand = { version = "0.8", default-features = false, features = ["small_rng", "std"] }

[features]
default = []
# Enables `cortex_snn::disk` — filesystem reader/writer for `.cortex/`
# folders. Off by default so embed-anywhere consumers (wasm, FFI,
# pure-sim tests) pull zero filesystem code. Pure `std::fs`, no
# extra deps; the feature flag just gates the module compilation.
disk = []

[dev-dependencies]
serde_json = { workspace = true }
