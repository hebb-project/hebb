name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: check (hebb with disk feature)
        run: cargo check -p hebb --features disk --all-targets

      - name: test (hebb)
        run: cargo test -p hebb --features disk

  python-bindings:
    name: python bindings
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install maturin
        run: pip install maturin

      - name: build wheel
        run: maturin build --release

      - name: smoke test
        run: |
          pip install --find-links target/wheels hebb-py
          python -c "import hebb; print('hebb', hebb.__version__)"
